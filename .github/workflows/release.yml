name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Test
        run: nix develop -c just test
      - name: Lint
        run: nix develop -c just lint
      - name: Changelog
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}${GITHUB_REF_NAME}
          { echo "## Changes${prev:+ since $prev}"; echo; git log --no-merges --pretty='- %s' "$range"; } > CHANGELOG.md
          cat CHANGELOG.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "touragent.nvim $GITHUB_REF_NAME" --notes-file CHANGELOG.md
